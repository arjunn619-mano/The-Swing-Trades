# Strategy parameters — tweak here without touching code (Rule: params are fixed a priori,
# never tuned on the data they're evaluated on). See Planning Pack/05_STRATEGIES.md.

strategies:
  bullish_vol_rsi_candle:
    display_name: "Bottom Breakout"
    description: "Volume surge + low RSI + bullish candle (oversold reversal setup)."
    active: true
    params:
      volume_lookback_days: 14
      volume_ratio_min: 1.5        # today's volume >= 1.5x the prior 14-day average
      volume_min_absolute: 50000   # hard liquidity floor
      rsi_period: 14
      rsi_max: 50                  # RSI(14) < 50
      require_candle_pattern: true
      min_candle_score: 1
      prefer_exchange: "NSE"

  top_breakout:
    display_name: "Top Breakout"
    description: "Volume surge + high RSI (continuation) + bullish candle."
    active: true
    params:
      volume_lookback_days: 14
      volume_ratio_min: 1.5
      volume_min_absolute: 50000
      rsi_period: 14
      rsi_min: 55                  # RSI(14) > 55
      require_candle_pattern: true
      min_candle_score: 1
      prefer_exchange: "NSE"

  supertrend_buy:
    display_name: "Supertrend Buy"
    description: "ATR-based Supertrend flip from short to long, with volume confirmation."
    active: true
    params:
      atr_period: 10
      atr_multiplier: 3.0
      require_volume_confirmation: true
      volume_lookback_days: 14
      volume_ratio_min: 1.5
      volume_min_absolute: 50000
      prefer_exchange: "NSE"

  ema_base_breakout:
    display_name: "EMA Base Breakout"
    description: "Green candle back above EMA9/EMA15, price hugging the long EMA (+/-2.5%), still below Supertrend (red zone)."
    active: true
    params:
      fast_ema_period: 9
      mid_ema_period: 15
      long_ema_period: 200          # the "base" EMA; set to 250 to use the 250 EMA instead
      long_ema_vicinity_pct: 0.025  # |close - longEMA| / longEMA <= 2.5%
      volume_min_absolute: 50000    # liquidity floor (shares); Supertrend reuses ATR 10 / mult 3.0
      prefer_exchange: "NSE"

  news_positive:
    display_name: "Positive News"
    description: "Stocks with positive corporate news — order wins, buybacks, acquisitions, results, partnerships, new products, expansions, rating upgrades, fund-raising. Enrolled from BSE/NSE filings + news feeds; catalyst type tagged for hit-rate-by-catalyst. Research/observation only."
    active: true
    params:
      # Enrolled by the daily news-capture job + the EOD scan's news step (NOT the systematic
      # feature loop — it has no evaluate() class, so the scan skips it there by design).
      dedup_window_days: 2
      fuzzy_headline_threshold: 90
      llm:
        model_primary: "gemini-flash-lite-latest"   # free tier; ~1/1000 of daily quota (see build notes)
        model_fallback: "claude-haiku-4-5"           # ~Rs.150/mo break-glass if Gemini free ever breaks
        batch_size: 50
        batch_token_cap: 8000
        min_call_spacing_s: 5
      health:
        bse_soft_min: 50
        nse_soft_min: 10
        log_only_count: true   # week-1 calibration: do NOT alarm on low/empty counts yet (hard failures still alarm)

# Default observation window for every tracker entry (trading days). Configurable per Rule 8 / M5.
tracking_horizon_days: 100
