name: EOD Scan

on:
  # Triggered once a day by Vercel Cron (web/app/api/cron/scan) — the single reliable scheduler.
  # GitHub's own `schedule:` cron is deliberately NOT used here (it doesn't fire reliably).
  # The runner refuses to scan 'today' before 16:00 IST and skips NSE holidays itself.
  workflow_dispatch:
    inputs:
      rescan_today:
        description: "Reset & re-scan today (use if today was scanned pre-close on stale prices)"
        type: boolean
        default: false

# Prerequisite (run once via the "Bootstrap" workflow): init DB + refresh universe + backfill.
jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
      DHAN_PIN: ${{ secrets.DHAN_PIN }}
      DHAN_TOTP_SECRET: ${{ secrets.DHAN_TOTP_SECRET }}
      ALERT_TELEGRAM_BOT_TOKEN: ${{ secrets.ALERT_TELEGRAM_BOT_TOKEN }}
      ALERT_TELEGRAM_CHAT_ID: ${{ secrets.ALERT_TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install worker
        run: pip install ./worker

      - name: Refresh universe (cheap; picks up new listings)
        working-directory: worker
        run: python scripts/refresh_universe.py

      - name: Run EOD scan (catchup-aware; or reset+rescan today)
        working-directory: worker
        run: |
          if [ "${{ inputs.rescan_today }}" = "true" ]; then
            python scripts/rescan_today.py
          else
            python scripts/run_scan_if_needed.py
          fi

      - name: Upload health artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-${{ github.run_id }}
          path: worker/artifacts/
          if-no-files-found: warn
