name: EOD Scan

on:
  # Triggered daily by Vercel Cron (web/vercel.json -> web/app/api/cron/scan) via workflow_dispatch.
  # GitHub's own `schedule:` cron is intentionally NOT used — it does not fire reliably for this
  # repo (a documented, widespread GitHub issue: scheduled runs are delayed/dropped). The default
  # run scans the last settled session; the worker self-skips weekends/holidays.
  workflow_dispatch:
    inputs:
      rescan_today:
        description: "Reset & re-scan today (use if today was scanned pre-close on stale prices)"
        type: boolean
        default: false

# Prerequisite (run once via the "Bootstrap" workflow): init DB + refresh universe + backfill.
jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
      DHAN_PIN: ${{ secrets.DHAN_PIN }}
      DHAN_TOTP_SECRET: ${{ secrets.DHAN_TOTP_SECRET }}
      ALERT_TELEGRAM_BOT_TOKEN: ${{ secrets.ALERT_TELEGRAM_BOT_TOKEN }}
      ALERT_TELEGRAM_CHAT_ID: ${{ secrets.ALERT_TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install worker
        run: pip install ./worker

      - name: Refresh universe (cheap; picks up new listings)
        working-directory: worker
        run: python scripts/refresh_universe.py

      - name: Run EOD scan (last settled session; or reset+rescan today)
        working-directory: worker
        run: |
          if [ "${{ inputs.rescan_today }}" = "true" ]; then
            python scripts/rescan_today.py
          else
            python scripts/scan_last_session.py
          fi

      - name: Upload health artifact
        if: always()
        continue-on-error: true   # a full artifact quota must NOT fail the scan (data is in Neon)
        uses: actions/upload-artifact@v4
        with:
          name: scan-${{ github.run_id }}
          path: worker/artifacts/
          if-no-files-found: warn
          retention-days: 14       # auto-expire (default 90) so artifacts don't pile up to the quota
