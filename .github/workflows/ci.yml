name: CI

on:
  push:
    paths: ["worker/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["worker/**", ".github/workflows/ci.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: swing_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/swing_test
      RUN_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Secret scan (nothing sensitive is committed)
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then echo '::error::a .env file is committed'; exit 1; fi
          if git grep -nE 'BEGIN (RSA|OPENSSH|EC|DSA|PGP) PRIVATE KEY' -- ':!*.md'; then echo '::error::a private key is committed'; exit 1; fi
          echo "secret scan clean"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install worker
        run: pip install -e "./worker[dev]"

      - name: Run tests (incl. real-Postgres integration test)
        run: pytest worker -q
